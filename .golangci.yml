version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - errcheck
    - exhaustive
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 150
      statements: 60
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - ifElseChain
      enabled-tags:
        - diagnostic
    gocyclo:
      min-complexity: 25
    lll:
      line-length: 140
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -QF1003
        - -QF1008
        - -ST1003
        - -SA9003
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - funlen
          - gocyclo
          - lll
          - mnd
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - dupl
          - errcheck
          - funlen
          - goconst
        path: examples/
      - linters:
          - gocritic
          - staticcheck
          - unused
        path: _easyjson\.go
      - linters:
          - staticcheck
        source: if e.debug
      - linters:
          - staticcheck
        path: _test\.go
      - linters:
          - staticcheck
        source: if tt.jsonData
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print.*|os\.(Un)?Setenv). is not checked
    paths:
      - examples
      - testdata
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
