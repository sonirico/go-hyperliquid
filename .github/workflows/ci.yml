name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Install tools
      run: make install-tools

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Check formatting
      run: |
        make fmt
        git diff --exit-code

    - name: Check generated files
      run: |
        make generate
        git diff --exit-code

    - name: Lint
      run: make lint

    - name: Run tests (excluding examples)
      run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v examples)

    - name: Upload coverage to Coveralls
      if: matrix.go-version == '1.27.4'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.out

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.4'

    - name: Install tools
      run: make install-tools

    - name: Run Gosec Security Scanner
      run: gosec -exclude-dir=examples ./...

  live:
    name: Live signature checks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.4'

    - name: Verify signatures against the testnet
      run: make verify-live

    - name: Verify websocket post against the testnet
      run: go test -tags live -run TestLiveWsPost -count=1 .
